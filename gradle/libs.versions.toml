# Single source of truth for versions. Verified on Maven Central (2026-11).
[versions]
java = "21"                 # baseline; builds and runs unchanged on Java 25 LTS
springBoot = "4.1.2"        # latest GA Spring Boot (Spring Framework 7, Reactor 2025.x, Jackson 3)
springCloud = "2025.1.4"    # Spring Cloud release train used for Gateway + reactive circuit breaker

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-cloud-bom = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "springCloud" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }

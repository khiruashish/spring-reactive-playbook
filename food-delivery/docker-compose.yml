# Local stack for the reactive food delivery platform.
#   docker compose up -d                      → infrastructure only (run services from the IDE / gradle bootRun)
#   docker compose --profile apps up -d --build → infrastructure + all six services
name: food-delivery

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
    ports: ["5432:5432"]
    volumes:
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller                   # KRaft: no ZooKeeper
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  # ---------- application services (profile: apps) ----------
  restaurant-service:
    profiles: [apps]
    build: { context: .., dockerfile: food-delivery/Dockerfile, args: { SERVICE: restaurant-service } }
    environment: { DB_HOST: postgres }
    ports: ["8081:8081"]
    depends_on: { postgres: { condition: service_healthy } }

  payment-service:
    profiles: [apps]
    build: { context: .., dockerfile: food-delivery/Dockerfile, args: { SERVICE: payment-service } }
    ports: ["8085:8085"]

  order-service:
    profiles: [apps]
    build: { context: .., dockerfile: food-delivery/Dockerfile, args: { SERVICE: order-service } }
    environment:
      DB_HOST: postgres
      KAFKA_BOOTSTRAP: kafka:19092
      RESTAURANT_URL: http://restaurant-service:8081
      PAYMENT_URL: http://payment-service:8085
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  delivery-service:
    profiles: [apps]
    build: { context: .., dockerfile: food-delivery/Dockerfile, args: { SERVICE: delivery-service } }
    environment:
      MONGO_URI: mongodb://mongo:27017/delivery_db
      KAFKA_BOOTSTRAP: kafka:19092
    ports: ["8083:8083"]
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }

  notification-service:
    profiles: [apps]
    build: { context: .., dockerfile: food-delivery/Dockerfile, args: { SERVICE: notification-service } }
    environment: { KAFKA_BOOTSTRAP: kafka:19092 }
    ports: ["8084:8084"]
    depends_on: { kafka: { condition: service_healthy } }

  api-gateway:
    profiles: [apps]
    build: { context: .., dockerfile: food-delivery/Dockerfile, args: { SERVICE: api-gateway } }
    environment:
      RESTAURANT_URL: http://restaurant-service:8081
      ORDER_URL: http://order-service:8082
      DELIVERY_URL: http://delivery-service:8083
      NOTIFICATION_URL: http://notification-service:8084
      NOTIFICATION_WS_URL: ws://notification-service:8084
    ports: ["8080:8080"]

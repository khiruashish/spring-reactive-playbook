name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (examples + food delivery services)
        run: ./gradlew build --no-daemon
      - name: Coding-interview test reports match the docs
        working-directory: coding-interview
        run: python3 report.py --check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build docs (fails on broken links or missing example snippets)
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
